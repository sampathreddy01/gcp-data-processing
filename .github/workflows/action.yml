name: Upload to GCS

on:
  push:
    branches:
      - main
    paths:
      - composer_dags/* # Specify the path to the file you want to upload

jobs:
  upload-to-gcs:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v2

    - name: 'Setup Google Cloud SDK'
      uses: google-github-actions/setup-gcloud@v0.2.1
      with:
        version: 'latest'
        service_account_key: ${{ secrets.GCP_CREDENTIALS }}
        export_default_credentials: true

    - name: Authenticate to GCP
      run: gcloud auth activate-service-account --key-file=${{ secrets.GCP_CREDENTIALS }}

    - name: Upload file to GCS
      run: |
        gsutil cp composer_dags gs://sampath1729reddycomposerbucket/dag/
      env:
        GCS_KEY_FILE: ${{ secrets.GCP_SA_KEY }}

name: Submit Dataproc Job

on:
  push:
    branches:
      - main
    paths:
      - spark_code/spark_stream.py # Specify the path to your Spark job file

jobs:
  submit-dataproc-job:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v2

    - name: 'Setup Google Cloud SDK'
      uses: google-github-actions/setup-gcloud@v0.2.1
      with:
        version: 'latest'
        service_account_key: ${{ secrets.GCP_CREDENTIALS }}
        export_default_credentials: true

      - name: Authenticate to GCP
        run: gcloud auth activate-service-account --key-file=${{ secrets.GCP_CREDENTIALS }}

      - name: Submit Spark job to Dataproc
        run: |
          gcloud dataproc jobs submit spark_code/spark_stream.py \
            --cluster=dataproc-test-composer \
            --region=us-central-1 \
            --project=${{ secrets.GCP_PROJECT_ID }}
